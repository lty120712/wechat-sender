[wechat]
; 好友昵称（独立聊天窗口的标题）
friend_name = runner 锐角
; 窗口类名（留空则按标题模糊查找）
window_class = Qt51514QWindowIcon

[message]
; 循环发送消息来源（推荐：外部文本文件，一行一条）
source = data/messages.txt
; 抽取方式：sequential（轮流）或 random（随机）
message_mode = sequential

[schedule]
; 循环发送模式：interval 或 daily
mode = interval
; interval 模式：间隔秒数
interval_seconds = 360
; daily 模式：每天固定时间发送（格式 HH:MM）
daily_time = 08:00

[timed_messages]
; 到点发送：每天到指定时间发送指定消息，和循环发送不冲突
; 格式：HH:MM = 消息内容
; 示例：
; 14:00 = 下午好
; 18:00 = 下班了？

12:00 = 吃饭了？
14:00 = 下午好!
18:00 = 下班了？
22:00 = 睡觉了？

[advanced]
; 发送前等待秒数（用于窗口准备好）
send_delay = 0.5
; 字符间隔秒数（PostMessage WM_CHAR 间隔）
char_interval = 0.05
