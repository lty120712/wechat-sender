[wechat]
; 好友昵称（独立聊天窗口的标题）
friend_name = runner 锐角
; 窗口类名（留空则按标题模糊查找）
window_class = Qt51514QWindowIcon

[message]
; 循环发送消息来源（Excel 表格）
;   工作表 [循环消息]：列 = 消息标题 | 消息体
;   工作表 [到点消息]：列 = 时间 | 消息标题 | 消息体
source = data/messages.xlsx
; 抽取方式：sequential（轮流）或 random（随机）
message_mode = sequential

[schedule]
; 循环发送模式（目前仅支持 interval）
mode = interval
; 间隔秒数
interval_seconds = 60

[advanced]
; 发送前等待秒数（用于窗口准备好）
send_delay = 0.5
; 字符间隔秒数（PostMessage WM_CHAR 间隔）
char_interval = 0.05
